name: Flutter CI/CD

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Use macOS-latest if you need to build iOS, otherwise ubuntu-latest is faster for Android
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java (Required for Android builds)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up the Flutter SDK environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Optional: Specify exact version (e.g., '3.24.0') to avoid breaking changes
          # flutter-version: '3.24.0' 

      # 4. Fetch dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Run static code analysis (Linter)
      - name: Analyze Code
        run: flutter analyze

      # 6. Run unit tests
      - name: Run Tests
        run: flutter test

      # 7. Build the Release APK (Android)
      - name: Build Android APK
        run: flutter build apk --release

      # 8. Build the App Bundle (Optional, for Google Play Store)
      - name: Build Android App Bundle
        run: flutter build appbundle --release

      # 9. Upload the generated APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
